<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محوّل العملات — مقبالي</title>
  <meta name="description" content="محوّل عملات فوري بأسعار السوق العالمي">
  <link rel="icon" href="images/coins.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; background: #f5f0e8;
      font-family: 'Cairo', sans-serif;
      display: flex; flex-direction: column; align-items: center; padding-bottom: 4rem;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background: radial-gradient(ellipse at 20% 20%, rgba(200,169,110,.07) 0%, transparent 50%),
                  radial-gradient(ellipse at 80% 80%, rgba(200,169,110,.04) 0%, transparent 45%);
      pointer-events: none;
    }
    .nav {
      width: 100%; padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(245,240,232,0.92); backdrop-filter: blur(12px);
      border-bottom: 0.5px solid rgba(200,169,110,0.2);
      position: sticky; top: 0; z-index: 100;
    }
    .nav-logo { font-size: 13px; font-weight: 700; color: #c8a96e; letter-spacing: 2px; text-decoration: none; }
    .nav-title { font-size: 13px; color: #888; }
    .live-badge {
      display: flex; align-items: center; gap: 5px; font-size: 10px; color: #666;
      background: rgba(200,169,110,0.1); border: 0.5px solid rgba(200,169,110,0.2);
      border-radius: 20px; padding: 3px 10px;
    }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #4caf50; animation: blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1}50%{opacity:.4} }

    .container { width: 100%; max-width: 480px; padding: 16px; }

    /* TIMER */
    .timer-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .timer-ring { position: relative; width: 38px; height: 38px; flex-shrink: 0; }
    .timer-ring svg { transform: rotate(-90deg); }
    .timer-bg { fill: none; stroke: rgba(200,169,110,0.15); stroke-width: 3; }
    .timer-prog { fill: none; stroke: #c8a96e; stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
    .timer-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #c8a96e; }
    .update-time { font-size: 11px; color: #999; }
    .update-time b { color: #666; font-weight: 600; }

    /* BASE CARD */
    .base-card {
      background: #fff; border: 2px solid #c8a96e; border-radius: 16px;
      padding: 14px 16px; margin-bottom: 8px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 4px 20px rgba(200,169,110,0.12);
    }
    .flag { font-size: 28px; flex-shrink: 0; line-height: 1; }
    .flag-sm { font-size: 24px; flex-shrink: 0; line-height: 1; }
    .base-left { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .curr-code { font-size: 16px; font-weight: 700; color: #2a1f0a; }
    .chevron { font-size: 11px; color: #c8a96e; }
    .base-right { display: flex; align-items: center; gap: 8px; margin-right: auto; }
    .base-symbol { font-size: 14px; color: #aaa; }
    .base-input {
      font-size: 26px; font-weight: 700; color: #2a1f0a;
      direction: ltr; text-align: right;
      border: none; background: transparent; outline: none;
      font-family: 'Cairo', sans-serif; width: 130px;
    }
    .clear-btn {
      width: 34px; height: 34px; border-radius: 8px; flex-shrink: 0;
      border: 0.5px solid rgba(200,169,110,0.2); background: rgba(200,169,110,0.06);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: #c8a96e; transition: background 0.2s;
    }
    .clear-btn:hover { background: rgba(200,169,110,0.15); }
    .clear-btn svg { width: 14px; height: 14px; }

    /* HIDDEN SELECT OVERLAY */
    .select-overlay { position: relative; }
    .select-overlay select {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 16px;
    }

    /* CURRENCY ROWS */
    .list { display: flex; flex-direction: column; gap: 6px; }
    .c-row {
      background: #fff; border: 0.5px solid rgba(200,169,110,0.15); border-radius: 14px;
      padding: 12px 14px; display: flex; align-items: center; gap: 12px;
      transition: all 0.2s; animation: fadeUp 0.35s ease both;
    }
    .c-row:hover { border-color: rgba(200,169,110,0.4); background: #fdf9f3; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)} }
    .c-info { flex: 1; cursor: pointer; }
    .c-code { font-size: 15px; font-weight: 700; color: #2a1f0a; }
    .c-name { font-size: 11px; color: #aaa; margin-top: 1px; }
    .c-result { text-align: left; }
    .c-amount { font-size: 20px; font-weight: 700; color: #2a1f0a; direction: ltr; }
    .c-rate { font-size: 10px; color: #ccc; direction: ltr; margin-top: 2px; }
    .c-menu {
      display: flex; flex-direction: column; gap: 3px; padding: 6px 8px;
      cursor: pointer; border-radius: 8px; transition: background 0.15s; color: #ccc;
    }
    .c-menu:hover { background: rgba(200,169,110,0.1); color: #c8a96e; }
    .c-menu span { width: 4px; height: 4px; background: currentColor; border-radius: 50%; display: block; }

    /* BOTTOM ROW */
    .bottom-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 2px;
    }
    .add-btn {
      display: flex; align-items: center; gap: 6px;
      font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 600;
      color: #c8a96e; background: transparent; border: none; cursor: pointer;
      padding: 6px 10px; border-radius: 8px; transition: background 0.2s;
    }
    .add-btn:hover { background: rgba(200,169,110,0.1); }
    .mid-label { font-size: 11px; color: #bbb; }

    /* MODAL */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.25);
      backdrop-filter: blur(4px); z-index: 200;
      display: none; align-items: flex-end; justify-content: center;
    }
    .overlay.open { display: flex; }
    .modal {
      width: 100%; max-width: 480px; background: #fff;
      border-radius: 24px 24px 0 0; padding: 20px 16px;
      max-height: 72vh; overflow-y: auto;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp { from{transform:translateY(100%)}to{transform:translateY(0)} }
    .modal-title { font-size: 15px; font-weight: 700; color: #2a1f0a; margin-bottom: 12px; }
    .modal-search {
      width: 100%; padding: 10px 14px; border-radius: 12px;
      border: 1px solid rgba(200,169,110,0.2); background: #faf7f2;
      font-family: 'Cairo', sans-serif; font-size: 13px; color: #2a1f0a;
      outline: none; margin-bottom: 10px; direction: rtl;
    }
    .modal-search:focus { border-color: #c8a96e; background: #fff; }
    .m-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 10px; cursor: pointer;
      transition: background 0.15s;
    }
    .m-item:hover { background: rgba(200,169,110,0.08); }
    .m-item-code { font-size: 13px; font-weight: 700; color: #2a1f0a; }
    .m-item-name { font-size: 11px; color: #aaa; }

    /* FOOTER */
    .footer { margin-top: 1.5rem; text-align: center; font-size: 11px; color: #bbb; }
    .footer a { color: #c8a96e; text-decoration: none; font-weight: 600; }

    @media (max-width: 400px) {
      .base-input { font-size: 20px; width: 100px; }
      .c-amount { font-size: 17px; }
    }
  </style>
</head>
<body>

<nav class="nav">
  <a href="https://www.maqbali.com" class="nav-logo">Maqbali</a>
  <span class="nav-title">محوّل العملات</span>
  <div class="live-badge"><span class="live-dot"></span>مباشر</div>
</nav>

<div class="container">

  <div class="timer-row">
    <div class="timer-ring">
      <svg width="38" height="38" viewBox="0 0 38 38">
        <circle class="timer-bg" cx="19" cy="19" r="16"/>
        <circle class="timer-prog" id="t-prog" cx="19" cy="19" r="16" stroke-dasharray="100.5" stroke-dashoffset="0"/>
      </svg>
      <div class="timer-num" id="t-num">30</div>
    </div>
    <div class="update-time">آخر تحديث: <b id="t-time">—</b></div>
  </div>

  <!-- BASE -->
  <div class="base-card">
    <div class="select-overlay">
      <div class="base-left">
        <span class="flag" id="b-flag">🇴🇲</span>
        <span class="curr-code" id="b-code">OMR</span>
        <span class="chevron">▾</span>
      </div>
      <select id="b-select" onchange="setBase(this.value)"></select>
    </div>
    <div class="base-right">
      <span class="base-symbol" id="b-sym">ر.ع</span>
      <input class="base-input" id="b-input" type="number" value="1" min="0" step="any" oninput="convert()">
      <button class="clear-btn" onclick="document.getElementById('b-input').value=1;convert()">
        <svg fill="none" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>

  <div class="list" id="list"></div>

  <div class="bottom-row">
    <button class="add-btn" onclick="openModal()">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      أضف عملة
    </button>
    <span class="mid-label">أسعار السوق المتوسطة</span>
  </div>

  <div class="footer">
    جميع الحقوق محفوظة © 2026 &nbsp;—&nbsp; صمم ♥ <a href="https://www.maqbali.com">Maqbali</a>
  </div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-title">اختر عملة</div>
    <input class="modal-search" id="m-search" placeholder="ابحث..." oninput="filterModal()">
    <div id="m-list"></div>
  </div>
</div>

<script>
const CURRENCIES = [
  { code:'OMR', name:'ريال عُماني',        flag:'🇴🇲', sym:'ر.ع'  },
  { code:'USD', name:'دولار أمريكي',       flag:'🇺🇸', sym:'$'    },
  { code:'EUR', name:'يورو',                flag:'🇪🇺', sym:'€'    },
  { code:'AED', name:'درهم إماراتي',       flag:'🇦🇪', sym:'د.إ'  },
  { code:'SAR', name:'ريال سعودي',         flag:'🇸🇦', sym:'ر.س'  },
  { code:'GBP', name:'جنيه إسترليني',      flag:'🇬🇧', sym:'£'    },
  { code:'INR', name:'روبية هندية',        flag:'🇮🇳', sym:'₹'    },
  { code:'JPY', name:'ين ياباني',          flag:'🇯🇵', sym:'¥'    },
  { code:'KWD', name:'دينار كويتي',        flag:'🇰🇼', sym:'د.ك'  },
  { code:'BHD', name:'دينار بحريني',       flag:'🇧🇭', sym:'د.ب'  },
  { code:'QAR', name:'ريال قطري',          flag:'🇶🇦', sym:'ر.ق'  },
  { code:'EGP', name:'جنيه مصري',          flag:'🇪🇬', sym:'ج.م'  },
  { code:'PKR', name:'روبية باكستانية',    flag:'🇵🇰', sym:'₨'    },
  { code:'PHP', name:'بيزو فلبيني',        flag:'🇵🇭', sym:'₱'    },
  { code:'CHF', name:'فرنك سويسري',        flag:'🇨🇭', sym:'Fr'   },
  { code:'CNY', name:'يوان صيني',          flag:'🇨🇳', sym:'¥'    },
  { code:'CAD', name:'دولار كندي',         flag:'🇨🇦', sym:'C$'   },
  { code:'AUD', name:'دولار أسترالي',      flag:'🇦🇺', sym:'A$'   },
  { code:'TRY', name:'ليرة تركية',         flag:'🇹🇷', sym:'₺'    },
  { code:'MYR', name:'رينغيت ماليزي',      flag:'🇲🇾', sym:'RM'   },
  { code:'BDT', name:'تاكا بنغلاديشية',   flag:'🇧🇩', sym:'৳'    },
  { code:'SGD', name:'دولار سنغافوري',     flag:'🇸🇬', sym:'S$'   },
  { code:'IDR', name:'روبية إندونيسية',    flag:'🇮🇩', sym:'Rp'   },
];

let rates = {};
let base = 'OMR';
let active = ['USD','EUR','AED','INR'];
let ticker = 30;
let tickerInt;

// Build select
const bSel = document.getElementById('b-select');
CURRENCIES.forEach(c => {
  const o = document.createElement('option');
  o.value = c.code; o.textContent = `${c.flag} ${c.code} — ${c.name}`;
  if (c.code === 'OMR') o.selected = true;
  bSel.appendChild(o);
});

function getC(code) { return CURRENCIES.find(c => c.code === code) || { code, name: code, flag:'🌐', sym: code }; }

async function fetchRates() {
  try {
    const res = await fetch(`https://api.frankfurter.app/latest?from=${base}`);
    const d = await res.json();
    rates = { ...d.rates, [base]: 1 };
    const now = new Date();
    document.getElementById('t-time').textContent =
      now.toLocaleDateString('ar-OM',{timeZone:'Asia/Muscat',day:'numeric',month:'short',year:'numeric'}) + ' ' +
      now.toLocaleTimeString('ar-OM',{timeZone:'Asia/Muscat',hour:'2-digit',minute:'2-digit'});
    convert();
    resetTicker();
  } catch(e) { console.error(e); }
}

function convert() {
  const amt = parseFloat(document.getElementById('b-input').value) || 0;
  const list = document.getElementById('list');
  list.innerHTML = '';
  active.forEach((code, i) => {
    const c = getC(code);
    const rate = rates[code] || 0;
    const val = amt * rate;
    const row = document.createElement('div');
    row.className = 'c-row';
    row.style.animationDelay = `${i * 0.04}s`;
    row.innerHTML = `
      <span class="flag-sm">${c.flag}</span>
      <div class="c-info" onclick="setBase('${code}')">
        <div class="c-code">${c.code}</div>
        <div class="c-name">${c.name}</div>
      </div>
      <div class="c-result">
        <div class="c-amount">${c.sym} ${rate ? val.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:4}) : '—'}</div>
        <div class="c-rate">1 ${base} = ${rate ? rate.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:4}) : '—'} ${code}</div>
      </div>
      <div class="c-menu" onclick="removeC('${code}')"><span></span><span></span><span></span></div>
    `;
    list.appendChild(row);
  });
}

function setBase(code) {
  base = code;
  const c = getC(code);
  document.getElementById('b-flag').textContent = c.flag;
  document.getElementById('b-code').textContent = c.code;
  document.getElementById('b-sym').textContent = c.sym;
  document.getElementById('b-select').value = code;
  fetchRates();
}

function removeC(code) {
  active = active.filter(c => c !== code);
  convert();
}

// TIMER
function resetTicker() {
  clearInterval(tickerInt);
  ticker = 30;
  updateTicker();
  tickerInt = setInterval(() => {
    ticker--;
    updateTicker();
    if (ticker <= 0) fetchRates();
  }, 1000);
}

function updateTicker() {
  const prog = document.getElementById('t-prog');
  const num = document.getElementById('t-num');
  const c = 100.5;
  prog.style.strokeDashoffset = c * (1 - ticker / 30);
  num.textContent = ticker;
}

// MODAL
function openModal() {
  document.getElementById('overlay').classList.add('open');
  document.getElementById('m-search').value = '';
  renderModal('');
  setTimeout(() => document.getElementById('m-search').focus(), 100);
}

function closeModal(e) {
  if (e.target === document.getElementById('overlay'))
    document.getElementById('overlay').classList.remove('open');
}

function filterModal() {
  renderModal(document.getElementById('m-search').value);
}

function renderModal(q) {
  const ml = document.getElementById('m-list');
  const filtered = CURRENCIES.filter(c =>
    c.code !== base && !active.includes(c.code) &&
    (c.code.includes(q.toUpperCase()) || c.name.includes(q))
  );
  ml.innerHTML = filtered.map(c => `
    <div class="m-item" onclick="addC('${c.code}')">
      <span style="font-size:22px">${c.flag}</span>
      <div>
        <div class="m-item-code">${c.code}</div>
        <div class="m-item-name">${c.name}</div>
      </div>
    </div>
  `).join('');
}

function addC(code) {
  if (!active.includes(code)) active.push(code);
  document.getElementById('overlay').classList.remove('open');
  convert();
}

fetchRates();
</script>
</body>
</html>
