<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{PAGE_TITLE}}</title>
<meta name="description" content="{{PAGE_DESCRIPTION}}">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#f5f0e8">
<link rel="icon" href="/images/favicon.png" type="image/png">
<link rel="canonical" href="{{CANONICAL_URL}}">

<script src="/core/v1/core.js"></script>
<link rel="stylesheet" href="/core/v1/core.css">
<style>
.site-legacy * { box-sizing: border-box; margin: 0; padding: 0; }
.site-legacy {
      font-family: "Cairo", sans-serif;
      direction: rtl;
      background: #0e0e0e;
      min-height: 100vh;
      padding: 2rem 1rem;
      color: #f0e6c8;
    }
.site-legacy .page { max-width: 860px; margin: 0 auto; }
.site-legacy .nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 28px; background: #161616;
      border: 0.5px solid rgba(201,168,76,0.15);
      border-radius: 12px; margin-bottom: 2.5rem;
    }
.site-legacy .nav-logo { display: flex; align-items: center; gap: 10px; }
.site-legacy .logo-box {
      width: 40px; height: 40px; border-radius: 8px;
      border: 1.5px dashed #c9a84c; background: #1a1a1a;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
.site-legacy .logo-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
.site-legacy .logo-text { font-size: 15px; font-weight: 600; color: #f0e6c8; }
.site-legacy .nav-link { font-size: 13px; color: #c9a84c; font-weight: 500; text-decoration: none; }
.site-legacy .nav-link:hover { text-decoration: underline; }
.site-legacy .hero { text-align: center; margin-bottom: 2.5rem; padding: 0 1rem; }
.site-legacy .hero h1 { font-size: 26px; font-weight: 700; color: #f0e6c8; margin-bottom: 8px; }
.site-legacy .hero p { font-size: 13px; color: #666; max-width: 380px; margin: 0 auto; line-height: 1.9; }
.site-legacy .grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; margin-bottom: 2rem; }
.site-legacy .info-card {
      background: #161616; border-radius: 12px; padding: 1.4rem;
      border: 0.5px solid rgba(201,168,76,0.12);
    }
.site-legacy .info-title {
      font-size: 13px; font-weight: 600; color: #c9a84c;
      margin-bottom: 18px; padding-bottom: 10px;
      border-bottom: 0.5px solid rgba(201,168,76,0.15); letter-spacing: 0.5px;
    }
.site-legacy .info-item { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 18px; }
.site-legacy .info-icon {
      width: 34px; height: 34px; border-radius: 8px;
      background: #1e1e1e; border: 0.5px solid rgba(201,168,76,0.2);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
.site-legacy .info-item-text p { font-size: 11px; color: #555; margin-bottom: 2px; }
.site-legacy .info-item-text span { font-size: 13px; color: #d4c49a; font-weight: 500; }
.site-legacy .form-card {
      background: #161616; border-radius: 12px; padding: 1.5rem;
      border: 0.5px solid rgba(201,168,76,0.12);
    }
.site-legacy .form-title { font-size: 13px; font-weight: 600; color: #c9a84c; margin-bottom: 16px; letter-spacing: 0.5px; }
.site-legacy .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.site-legacy .form-group { margin-bottom: 10px; }
.site-legacy .form-group label { display: block; font-size: 11px; color: #555; margin-bottom: 5px; font-family: "Cairo", sans-serif; }
.site-legacy .form-group input, .site-legacy .form-group textarea, .site-legacy .form-group select {
      width: 100%; padding: 9px 12px; font-size: 13px; font-family: "Cairo", sans-serif;
      background: #1a1a1a; border: 0.5px solid rgba(201,168,76,0.2); border-radius: 8px;
      color: #f0e6c8; outline: none; transition: border-color 0.15s; direction: rtl;
    }
.site-legacy .form-group input:focus, .site-legacy .form-group textarea:focus, .site-legacy .form-group select:focus { border-color: #c9a84c; }
.site-legacy .form-group textarea { resize: none; height: 90px; }
.site-legacy .form-group select option { background: #1a1a1a; }
.site-legacy .submit-btn {
      width: 100%; padding: 10px; background: #c9a84c; color: #0e0e0e;
      font-size: 14px; font-weight: 700; font-family: "Cairo", sans-serif;
      border: none; border-radius: 8px; cursor: pointer; margin-top: 4px; transition: background 0.15s;
    }
.site-legacy .submit-btn:hover { background: #b8943a; }
.site-legacy .submit-btn:disabled { background: #555; cursor: not-allowed; }
.site-legacy .success { display: none; text-align: center; padding: 2rem 1rem; }
.site-legacy .success-icon {
      width: 50px; height: 50px; background: #1e1e1e;
      border: 1px solid rgba(201,168,76,0.3); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 14px;
    }
.site-legacy .success h3 { font-size: 15px; font-weight: 600; color: #f0e6c8; margin-bottom: 6px; }
.site-legacy .success p { font-size: 13px; color: #666; }
.site-legacy .error-msg {
      display: none; background: rgba(200,50,50,0.1); border: 0.5px solid rgba(200,50,50,0.3);
      border-radius: 8px; padding: 10px 14px; font-size: 12px; color: #e08080;
      margin-top: 10px; text-align: center;
    }
.site-legacy .footer {
      text-align: center; margin-top: 2rem; padding-top: 1.2rem;
      border-top: 0.5px solid rgba(201,168,76,0.12);
    }
.site-legacy .footer span { font-size: 12px; color: #444; }
.site-legacy .footer strong { color: #c9a84c; font-weight: 600; }
@media  (max-width: 580px) {.site-legacy .grid { grid-template-columns: 1fr; }
.site-legacy .form-row { grid-template-columns: 1fr; }
.site-legacy .nav { padding: 12px 16px; }}

/* Page-only colour bridge: the shared Core remains independent. */
.site-legacy {
 --bg:var(--site-bg);--bg-grad:var(--site-bg);--card:var(--site-panel);--card2:var(--site-gold-muted);
 --surface:var(--site-panel);--surface-2:var(--site-gold-muted);
 --text:var(--site-text);--text2:var(--site-text);--muted:var(--site-muted);--gold:var(--site-gold);
 --gold-dark:var(--site-gold);--brand:var(--site-gold);--line:var(--site-border);--border:var(--site-border);
 --border2:var(--site-border);--panel:var(--site-panel);--gold-muted:var(--site-gold-muted);
 --shadow:0 4px 20px rgba(0,0,0,.05);
 width:100%;min-width:0;min-height:0!important;padding:0!important;margin:0!important;
 background:transparent!important;color:var(--site-text)!important;
 font-family:'Cairo',Tahoma,Arial,sans-serif!important;
 display:block!important;
}
.site-legacy::before{display:none!important}
.site-main--legacy{max-width:1060px;padding-block:26px 48px;min-width:0;flex:1 0 auto}
.site-legacy img{max-width:100%}
.site-legacy button,.site-legacy input,.site-legacy textarea,.site-legacy select{font-family:inherit}
.site-legacy .page,.site-legacy .container,.site-legacy .wrap{max-width:100%;}
.site-legacy a{color:inherit;text-decoration:none}
.site-legacy a:focus-visible,.site-legacy button:focus-visible{outline:2px solid var(--site-gold);outline-offset:3px}
.site-legacy .footer,.site-legacy > footer{display:none}
.site-legacy input,.site-legacy textarea,.site-legacy select{max-width:100%}
.site-legacy .site-page-intro{display:none}
@media(max-width:580px){.site-main--legacy{padding-block:18px 36px}}


/* Colour refinements on legacy component surfaces */
.site-legacy .card,.site-legacy .price-card,.site-legacy .oil-card,.site-legacy .stat-card,
.site-legacy .device-card,.site-legacy .form-card,.site-legacy .info-card,.site-legacy .cve-card,
.site-legacy .details-card,.site-legacy .ip-card,.site-legacy .summary-card,.site-legacy .modal-box,
.site-legacy .filter-bar,.site-legacy .date-bar,.site-legacy .tool-card,
.site-legacy .gauge,.site-legacy .stats .stat,.site-legacy .chart-wrap,
.site-legacy .log-item,.site-legacy .map-card {background:var(--site-panel);border-color:var(--site-border);color:var(--site-text)}
.site-legacy .card-head,.site-legacy .info-banner{color:var(--site-text)}
.site-legacy .device-name,.site-legacy .info-title,.site-legacy .hero h1,.site-legacy .success h3 {color:var(--site-text)}
.site-legacy .device-category,.site-legacy .info-desc,.site-legacy .hero p,.site-legacy .success p,.site-legacy .form-group label,.site-legacy .info-item-text p {color:var(--site-muted)}
.site-legacy .changelog {background:var(--site-gold-muted);color:var(--site-text)}
.site-legacy .info-icon,.site-legacy .device-icon,.site-legacy .success-icon {background:var(--site-gold-muted)}
.site-legacy .form-group input,.site-legacy .form-group select,.site-legacy .form-group textarea,
.site-legacy .search-input,.site-legacy textarea {background:var(--site-panel);border-color:var(--site-border);color:var(--site-text)}
.site-legacy .form-title,.site-legacy .info-title,.site-legacy .section-title,.site-legacy .device-icon {color:var(--site-gold)}
.site-legacy .download-btn,.site-legacy .submit-btn,.site-legacy .btn-primary{background:var(--site-gold);color:var(--site-bg)}
.site-legacy .legacy-note {margin:25px 0 0;padding:13px 10px;text-align:center;color:var(--site-muted);font-size:12px;border-top:1px solid var(--site-border)}

</style>
</head>

<script>
    async function submitForm() {
      const btn = document.getElementById('submit-btn');
      const errorMsg = document.getElementById('error-msg');

      const firstName = document.querySelector('input[name="الاسم الأول"]').value.trim();
      const tribe = document.querySelector('input[name="القبيلة"]').value.trim();
      const email = document.querySelector('input[name="email"]').value.trim();
      const message = document.querySelector('textarea[name="الرسالة"]').value.trim();

      if (!firstName || !tribe || !email || !message) {
        errorMsg.textContent = 'يرجى تعبئة جميع الحقول المطلوبة';
        errorMsg.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'جاري الإرسال...';
      errorMsg.style.display = 'none';

      const formData = new FormData();
      formData.append('الاسم الأول', firstName);
      formData.append('القبيلة', tribe);
      formData.append('email', email);
      formData.append('الموضوع', document.querySelector('select[name="الموضوع"]').value);
      formData.append('الرسالة', message);

      try {
        const response = await fetch('https://formspree.io/f/mgopnvjw', {
          method: 'POST',
          body: formData,
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          document.getElementById('form-content').style.display = 'none';
          document.getElementById('success-msg').style.display = 'block';
        } else {
          throw new Error('فشل الإرسال');
        }
      } catch (e) {
        errorMsg.textContent = 'حدث خطأ، يرجى المحاولة مرة أخرى';
        errorMsg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'إرسال الرسالة ✦';
      }
    }
  </script>
</body>
