<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="معرض فيديوهات محمد المقبالي">
  <link rel="icon" href="images/favicon.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #f5f0e8;
      font-family: 'Cairo', sans-serif;
      display: flex; flex-direction: column; align-items: center;
    }
    .container { flex: 1; }

    body::before {
      content: ''; position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(200,169,110,.07) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(200,169,110,.04) 0%, transparent 45%);
      pointer-events: none;
    }

    /* NAV */
    .nav {
      width: 100%; padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(245,240,232,0.92); backdrop-filter: blur(12px);
      border-bottom: 0.5px solid rgba(200,169,110,0.2);
      position: sticky; top: 0; z-index: 100;
    }
    .nav-inner {
      width: 100%; max-width: 960px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-title { font-size: 15px; font-weight: 700; color: #2a1f0a; }
    .nav-logo { font-size: 13px; font-weight: 700; color: #c8a96e; letter-spacing: 2px; text-decoration: none; }

    /* CONTAINER */
    .container { width: 100%; max-width: 960px; padding: 24px 16px; flex: 1; }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    /* VIDEO CARD */
    .video-card {
      background: #fff;
      border: 0.5px solid rgba(200,169,110,0.2);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
      animation: fadeUp 0.5s ease both;
    }
    .video-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 36px rgba(200,169,110,0.15);
      border-color: rgba(200,169,110,0.4);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .video-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 */
      background: #1a1a1a;
      border-radius: 20px 20px 0 0;
      overflow: hidden;
    }
    .video-wrap iframe {
      position: absolute;
      inset: 0; width: 100%; height: 100%;
      border: none;
    }

    .video-info {
      padding: 14px 16px;
      border-top: 0.5px solid rgba(200,169,110,0.1);
    }
    .video-title {
      font-size: 13px; font-weight: 600; color: #2a1f0a;
      margin-bottom: 4px; line-height: 1.5;
    }
    .video-meta {
      display: flex; align-items: center; gap: 8px;
    }
    .video-source {
      font-size: 10px; color: #c8a96e; font-weight: 600;
      background: rgba(200,169,110,0.1);
      border: 0.5px solid rgba(200,169,110,0.2);
      border-radius: 20px; padding: 2px 8px;
    }
    .video-date { font-size: 10px; color: #bbb; }


    /* MENU BTN */
    .menu-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid rgba(200,169,110,0.3);
      background: rgba(200,169,110,0.06);
      cursor: pointer; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      transition: all 0.2s;
    }
    .menu-btn:hover { background: rgba(200,169,110,0.15); border-color: #c8a96e; }
    .menu-btn span { width: 16px; height: 1.5px; background: #c8a96e; border-radius: 2px; display: block; transition: all 0.25s; }

    /* DRAWER */
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.2);
      backdrop-filter: blur(3px); z-index: 200;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .drawer-overlay.open { opacity: 1; pointer-events: all; }
    .drawer {
      position: fixed; left: 0; top: 0; bottom: 0; width: 260px;
      background: #fff; z-index: 201;
      padding: 0;
      box-shadow: 4px 0 24px rgba(0,0,0,0.08);
      transform: translateX(-100%); transition: transform 0.3s cubic-bezier(.4,0,.2,1);
    }
    .drawer.open { transform: translateX(0); }
    .drawer-header {
      padding: 20px; border-bottom: 0.5px solid rgba(200,169,110,0.15);
      display: flex; align-items: center; justify-content: space-between;
    }
    .drawer-logo { font-size: 15px; font-weight: 700; color: #c8a96e; letter-spacing: 2px; text-decoration: none; }
    .drawer-close {
      width: 30px; height: 30px; border-radius: 50%; border: none;
      background: rgba(200,169,110,0.08); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: #c8a96e; font-size: 16px; transition: background 0.2s;
    }
    .drawer-close:hover { background: rgba(200,169,110,0.18); }
    .drawer-nav { padding: 12px 0; }
    .drawer-link {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 20px; font-size: 14px; font-weight: 600;
      color: #2a1f0a; text-decoration: none;
      transition: background 0.15s, color 0.15s;
      border-right: 3px solid transparent;
    }
    .drawer-link:hover { background: rgba(200,169,110,0.07); color: #c8a96e; border-right-color: #c8a96e; }
    .drawer-link svg { width: 18px; height: 18px; flex-shrink: 0; color: #c8a96e; }
    .drawer-link.active { background: rgba(200,169,110,0.1); color: #c8a96e; border-right-color: #c8a96e; }

    /* FOOTER */
    .footer { margin-top: 2rem; text-align: center; font-size: 11px; color: #bbb; }
    .footer a { color: #c8a96e; text-decoration: none; font-weight: 600; }

    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<script>
function openDrawer() {
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer-overlay').classList.add('open');
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer-overlay').classList.remove('open');
}
// Mark active page
const path = window.location.pathname.split('/').pop() || 'index.html';
document.querySelectorAll('.drawer-link').forEach(l => {
  if (l.getAttribute('href') === path) l.classList.add('active');
});
</script>
