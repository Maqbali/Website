<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نشرة الثغرات الأمنية — مقبالي</title>
  <meta name="description" content="آخر الثغرات الأمنية (CVEs) من NVD الرسمي">
  <link rel="icon" href="images/favicon.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0e;
      --card: #161616;
      --card2: #1a1a1a;
      --border: rgba(201,168,76,0.15);
      --border2: rgba(201,168,76,0.12);
      --text: #f0e6c8;
      --text2: #d4c49a;
      --muted: #555;
      --gold: #c9a84c;
    }
    body.light {
      --bg: #f5f0e8;
      --card: #ffffff;
      --card2: #f0ebe0;
      --border: rgba(150,120,40,0.25);
      --border2: rgba(150,120,40,0.15);
      --text: #2a1f0a;
      --text2: #4a3a1a;
      --muted: #999;
      --gold: #a07828;
    }

    body { font-family: 'Cairo', sans-serif; direction: rtl; background: var(--bg); min-height: 100vh; padding: 2rem 1rem; color: var(--text); transition: background 0.3s, color 0.3s; }
    .page { max-width: 900px; margin: 0 auto; }

    .nav { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: var(--card); border: 0.5px solid var(--border); border-radius: 12px; margin-bottom: 1.5rem; }
    .nav-btn-action { display: flex; align-items: center; gap: 7px; padding: 8px 16px; font-size: 13px; font-family: 'Cairo', sans-serif; background: var(--card2); border: 0.5px solid var(--border); border-radius: 8px; cursor: pointer; color: var(--gold); text-decoration: none; transition: all 0.15s; }
    .nav-btn-action:hover { background: var(--card); border-color: var(--gold); }
    .nav-btn-action svg { width: 14px; height: 14px; flex-shrink: 0; }
    .nav-controls { display: flex; align-items: center; gap: 8px; }
    .theme-btn { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--gold); background: var(--bg); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.25s; flex-shrink: 0; }
    .theme-btn svg { width: 16px; height: 16px; }

    .date-bar { background: var(--card); border: 0.5px solid var(--border2); border-radius: 10px; padding: 12px 20px; margin-bottom: 1.2rem; display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }

    .timer-row { display: flex; align-items: center; gap: 14px; margin-bottom: 1.2rem; padding: 0 4px; }
    .timer-ring { position: relative; width: 42px; height: 42px; flex-shrink: 0; }
    .timer-ring svg { transform: rotate(-90deg); }
    .timer-bg { fill: none; stroke: rgba(201,168,76,0.15); stroke-width: 3; }
    .timer-prog { fill: none; stroke: var(--gold); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
    .timer-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--gold); }
    .update-time { font-size: 13px; color: var(--muted); }
    .update-time b { color: var(--text2); font-weight: 600; }
    .date-item { text-align: center; }
    .date-label-sm { font-size: 10px; color: var(--muted); margin-bottom: 2px; }
    .date-value { font-size: 14px; font-weight: 600; color: var(--gold); }
    .date-sep { color: rgba(201,168,76,0.3); font-size: 18px; }

    .section-title { font-size: 13px; font-weight: 600; color: var(--gold); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 0.5px solid var(--border2); letter-spacing: 0.5px; }

    /* STATS */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1.5rem; }
    .stat-card { background: var(--card); border: 0.5px solid var(--border2); border-radius: 12px; padding: 1rem; text-align: center; }
    .stat-num { font-size: 22px; font-weight: 700; color: var(--text); }
    .stat-label { font-size: 10px; color: var(--muted); margin-top: 2px; letter-spacing: 0.5px; }
    .stat-card.critical .stat-num { color: #f44336; }
    .stat-card.high .stat-num { color: #ff9800; }
    .stat-card.medium .stat-num { color: #ffc107; }
    .stat-card.total .stat-num { color: var(--gold); }

    /* FILTER */
    .filter-bar { background: var(--card); border: 0.5px solid var(--border2); border-radius: 12px; padding: 10px 14px; margin-bottom: 1rem; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .filter-btn { padding: 5px 12px; border-radius: 20px; border: 0.5px solid var(--border); background: var(--card2); font-family: 'Cairo', sans-serif; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer; transition: all 0.2s; }
    .filter-btn.active { background: var(--gold); color: #111; border-color: var(--gold); }
    .filter-btn:hover:not(.active) { border-color: var(--gold); color: var(--gold); }
    .search-input { flex: 1; min-width: 150px; background: var(--card2); border: 0.5px solid var(--border); border-radius: 8px; padding: 6px 12px; font-family: 'Cairo', sans-serif; font-size: 12px; color: var(--text); outline: none; }
    .search-input:focus { border-color: var(--gold); }

    /* CVE LIST */
    .cve-list { display: flex; flex-direction: column; gap: 10px; }
    .cve-card { background: var(--card); border: 0.5px solid var(--border2); border-radius: 12px; padding: 14px; transition: border-color 0.2s; }
    .cve-card:hover { border-color: rgba(201,168,76,0.35); }
    .cve-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
    .cve-id { font-size: 12px; font-weight: 700; color: var(--gold); font-family: 'Courier New', monospace; }
    .cve-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .severity-badge { font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
    .sev-critical { background: rgba(244,67,54,0.15); color: #f44336; border: 0.5px solid rgba(244,67,54,0.3); }
    .sev-high { background: rgba(255,152,0,0.15); color: #ff9800; border: 0.5px solid rgba(255,152,0,0.3); }
    .sev-medium { background: rgba(255,193,7,0.15); color: #ffc107; border: 0.5px solid rgba(255,193,7,0.3); }
    .sev-low { background: rgba(76,175,80,0.15); color: #4caf50; border: 0.5px solid rgba(76,175,80,0.3); }
    .cvss-score { font-size: 11px; font-weight: 700; color: var(--text); background: var(--card2); padding: 2px 8px; border-radius: 6px; border: 0.5px solid var(--border); }
    .cve-date { font-size: 10px; color: var(--muted); }
    .cve-desc { font-size: 12px; color: var(--text2); line-height: 1.7; margin-bottom: 8px; }
    .cve-products { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
    .product-tag { font-size: 10px; color: var(--gold); background: rgba(201,168,76,0.08); border: 0.5px solid var(--border); padding: 2px 8px; border-radius: 10px; }

    .read-more-btn { margin-top: 10px; background: transparent; border: none; color: var(--gold); font-family: 'Cairo', sans-serif; font-size: 11px; font-weight: 600; cursor: pointer; padding: 4px 0; transition: opacity 0.2s; }
    .read-more-btn:hover { opacity: 0.7; }

    /* MODAL */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px); z-index: 300;
      display: none; align-items: center; justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      width: 100%; max-width: 560px; max-height: 85vh;
      background: var(--card); border: 0.5px solid var(--border);
      border-radius: 16px; overflow: hidden;
      display: flex; flex-direction: column;
      animation: modalIn 0.3s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes modalIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; border-bottom: 0.5px solid var(--border2);
    }
    .modal-header .cve-id { font-size: 14px; }
    .modal-close-x {
      width: 30px; height: 30px; border-radius: 50%; border: none;
      background: var(--card2); color: var(--muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; transition: all 0.15s;
    }
    .modal-close-x:hover { background: var(--gold); color: #111; }
    .modal-body {
      padding: 18px; overflow-y: auto; flex: 1;
    }
    .modal-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .modal-desc {
      font-size: 13px; color: var(--text2); line-height: 1.9;
      margin-bottom: 14px; white-space: pre-wrap; word-break: break-word;
    }
    .modal-section-title { font-size: 11px; color: var(--muted); margin: 12px 0 6px; letter-spacing: 0.5px; }
    .modal-link {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; background: rgba(201,168,76,0.1);
      border: 0.5px solid var(--border); border-radius: 8px;
      color: var(--gold); text-decoration: none; font-size: 12px; font-weight: 600;
      transition: all 0.15s; margin-top: 8px;
    }
    .modal-link:hover { background: var(--gold); color: #111; border-color: var(--gold); }
    .modal-footer {
      padding: 12px 18px; border-top: 0.5px solid var(--border2);
      display: flex; justify-content: flex-start;
    }
    .modal-close-btn {
      padding: 8px 22px; background: var(--card2); border: 0.5px solid var(--border);
      border-radius: 8px; color: var(--text); font-family: 'Cairo', sans-serif;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    .modal-close-btn:hover { background: var(--gold); color: #111; border-color: var(--gold); }

    .footer { text-align: center; margin-top: 2rem; padding-top: 1.2rem; border-top: 0.5px solid var(--border2); }
    .footer span { font-size: 12px; color: var(--muted); }
    .footer a { color: var(--gold); text-decoration: none; font-weight: 600; }

    @media (max-width: 580px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .nav { padding: 10px 14px; }
    }
  </style>
</head>
<body>
<div class="page">

  <div class="nav">
    <div class="date-item">
      <div class="date-label-sm">اليوم</div>
      <div class="date-value" id="date-day">-</div>
    </div>
    <div class="nav-controls">
      <button class="nav-btn-action" onclick="loadCVEs()">
        <svg fill="none" viewBox="0 0 24 24"><path d="M4 4v5h5M20 20v-5h-5M4 9a9 9 0 0115-3.87M20 15a9 9 0 01-15 3.87" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        تحديث
      </button>
      <button class="theme-btn" onclick="toggleTheme()" title="تغيير المظهر">
        <svg viewBox="0 0 24 24" fill="none"><path id="moon-path" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
    </div>
  </div>

  <div class="timer-row">
    <div class="timer-ring">
      <svg width="42" height="42" viewBox="0 0 42 42">
        <circle class="timer-bg" cx="21" cy="21" r="18"/>
        <circle class="timer-prog" id="t-prog" cx="21" cy="21" r="18" stroke-dasharray="113" stroke-dashoffset="0"/>
      </svg>
      <div class="timer-num" id="t-num">10:00</div>
    </div>
    <div class="update-time">آخر تحديث: <b id="last-update">—</b></div>
  </div>

  <div class="section-title">✦ حصيلة آخر 3 أيام</div>
  <div class="stats-grid">
    <div class="stat-card total">
      <div class="stat-num" id="stat-total">—</div>
      <div class="stat-label">إجمالي الثغرات</div>
    </div>
    <div class="stat-card critical">
      <div class="stat-num" id="stat-critical">—</div>
      <div class="stat-label">حرجة (9.0+)</div>
    </div>
    <div class="stat-card high">
      <div class="stat-num" id="stat-high">—</div>
      <div class="stat-label">عالية الخطورة</div>
    </div>
    <div class="stat-card medium">
      <div class="stat-num" id="stat-medium">—</div>
      <div class="stat-label">متوسطة</div>
    </div>
  </div>

  <div class="section-title">✦ الثغرات الأخيرة</div>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFilter('all')" data-f="all">الكل</button>
    <button class="filter-btn" onclick="setFilter('CRITICAL')" data-f="CRITICAL">حرجة</button>
    <button class="filter-btn" onclick="setFilter('HIGH')" data-f="HIGH">عالية</button>
    <button class="filter-btn" onclick="setFilter('MEDIUM')" data-f="MEDIUM">متوسطة</button>
    <input class="search-input" id="search" placeholder="🔍 ابحث بالمنتج (Windows, Adobe...)" oninput="renderList()">
  </div>

  <div class="cve-list" id="cve-list">
    <div class="loading">جاري تحميل الثغرات...</div>
  </div>

  <button class="load-more" id="load-more" onclick="loadMore()" style="display:none">تحميل المزيد</button>

  <div class="footer">
    <span style="display:flex;justify-content:space-between;align-items:center;width:100%">
      <span>جميع الحقوق محفوظة &copy; 2026</span>
      <span>البيانات من <a href="https://nvd.nist.gov" target="_blank">NVD</a> — صمم ♥ <a href="https://www.maqbali.com">Maqbali</a></span>
    </span>
  </div>

</div>

<!-- CVE MODAL -->
<div class="modal-overlay" id="cve-modal" onclick="closeCveModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="cve-id" id="modal-id">—</span>
      <button class="modal-close-x" onclick="closeCveModal()" aria-label="إغلاق">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-meta">
        <span class="severity-badge" id="modal-sev">—</span>
        <span class="cvss-score" id="modal-score">—</span>
        <span class="cve-date" id="modal-date">—</span>
      </div>
      <div class="modal-desc" id="modal-desc">—</div>
      <div id="modal-products-wrap" style="display:none">
        <div class="modal-section-title">✦ المنتجات المتأثرة</div>
        <div class="cve-products" id="modal-products"></div>
      </div>
      <a class="modal-link" id="modal-nvd-link" href="#" target="_blank">
        🔗 عرض في NVD الرسمي
      </a>
    </div>
    <div class="modal-footer">
      <button class="modal-close-btn" onclick="closeCveModal()">إغلاق</button>
    </div>
  </div>
</div>

<script>
// Theme
const savedTheme = localStorage.getItem('theme') || 'dark';
if (savedTheme === 'light') {
  document.body.classList.add('light');
  document.querySelector('#moon-path').setAttribute('stroke', '#a07828');
}
function toggleTheme() {
  const isLight = document.body.classList.toggle('light');
  document.querySelector('#moon-path').setAttribute('stroke', isLight ? '#a07828' : '#c9a84c');
  localStorage.setItem('theme', isLight ? 'light' : 'dark');
}

// Timer - 10 minutes countdown
let ticker = 600; // 10 minutes in seconds
let tickerInt;

function updateTicker() {
  const prog = document.getElementById('t-prog');
  const num = document.getElementById('t-num');
  const circumference = 113;
  prog.style.strokeDashoffset = circumference * (1 - ticker / 600);
  const m = Math.floor(ticker / 60);
  const s = ticker % 60;
  num.textContent = `${m}:${s.toString().padStart(2,'0')}`;
}

function resetTicker() {
  clearInterval(tickerInt);
  ticker = 600;
  updateTicker();
  tickerInt = setInterval(() => {
    ticker--;
    updateTicker();
    if (ticker <= 0) loadCVEs();
  }, 1000);
}

// Data
let allCVEs = [];
let currentFilter = 'all';
let displayCount = 20;

function formatDate(dateStr) {
  const d = new Date(dateStr);
  const diffMin = Math.floor((Date.now() - d.getTime()) / 60000);
  if (diffMin < 60) return `منذ ${diffMin} د`;
  if (diffMin < 1440) return `منذ ${Math.floor(diffMin / 60)} س`;
  return `منذ ${Math.floor(diffMin / 1440)} ي`;
}

function getSeverity(score) {
  if (score >= 9.0) return { label: 'حرجة', cls: 'sev-critical', key: 'CRITICAL' };
  if (score >= 7.0) return { label: 'عالية', cls: 'sev-high', key: 'HIGH' };
  if (score >= 4.0) return { label: 'متوسطة', cls: 'sev-medium', key: 'MEDIUM' };
  return { label: 'منخفضة', cls: 'sev-low', key: 'LOW' };
}

async function loadCVEs() {
  document.getElementById('cve-list').innerHTML = '<div class="loading">جاري تحميل الثغرات...</div>';

  const now = new Date();
  const threeDaysAgo = new Date(now.getTime() - 3 * 24 * 60 * 60 * 1000);
  const pubStart = threeDaysAgo.toISOString().split('.')[0] + '.000';
  const pubEnd = now.toISOString().split('.')[0] + '.000';

  try {
    const url = `https://services.nvd.nist.gov/rest/json/cves/2.0?pubStartDate=${pubStart}&pubEndDate=${pubEnd}&resultsPerPage=200`;
    const res = await fetch(url);
    const data = await res.json();

    allCVEs = (data.vulnerabilities || []).map(item => {
      const cve = item.cve;
      const metrics = cve.metrics?.cvssMetricV31?.[0] || cve.metrics?.cvssMetricV30?.[0] || cve.metrics?.cvssMetricV2?.[0];
      const score = metrics?.cvssData?.baseScore || 0;
      const desc = cve.descriptions?.find(d => d.lang === 'en')?.value || '';
      const products = new Set();
      cve.configurations?.forEach(cfg => {
        cfg.nodes?.forEach(node => {
          node.cpeMatch?.forEach(m => {
            const parts = m.criteria.split(':');
            if (parts[3] && parts[4]) products.add(parts[3] + ' ' + parts[4]);
          });
        });
      });
      return {
        id: cve.id,
        desc,
        score,
        published: cve.published,
        products: Array.from(products).slice(0, 4)
      };
    });

    allCVEs.sort((a, b) => b.score - a.score);
    updateStats();
    renderList();
    const now2 = new Date();
    document.getElementById('last-update').textContent =
      now2.toLocaleDateString('ar-OM',{timeZone:'Asia/Muscat',day:'numeric',month:'long',year:'numeric'}) + ' — ' +
      now2.toLocaleTimeString('ar-OM',{timeZone:'Asia/Muscat',hour:'2-digit',minute:'2-digit'});
    resetTicker();
  } catch(e) {
    document.getElementById('cve-list').innerHTML = '<div class="loading">تعذّر تحميل الثغرات. حاول مرة أخرى.</div>';
  }
}

function updateStats() {
  const crit = allCVEs.filter(c => c.score >= 9.0).length;
  const high = allCVEs.filter(c => c.score >= 7.0 && c.score < 9.0).length;
  const med = allCVEs.filter(c => c.score >= 4.0 && c.score < 7.0).length;
  document.getElementById('stat-total').textContent = allCVEs.length;
  document.getElementById('stat-critical').textContent = crit;
  document.getElementById('stat-high').textContent = high;
  document.getElementById('stat-medium').textContent = med;
}

function setFilter(f) {
  currentFilter = f;
  displayCount = 20;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.f === f);
  });
  renderList();
}

function renderList() {
  const q = document.getElementById('search').value.toLowerCase();
  let filtered = allCVEs;

  if (currentFilter !== 'all') {
    filtered = filtered.filter(c => getSeverity(c.score).key === currentFilter);
  }

  if (q) {
    filtered = filtered.filter(c =>
      c.desc.toLowerCase().includes(q) ||
      c.products.some(p => p.toLowerCase().includes(q)) ||
      c.id.toLowerCase().includes(q)
    );
  }

  const shown = filtered.slice(0, displayCount);
  const list = document.getElementById('cve-list');

  if (!shown.length) {
    list.innerHTML = '<div class="loading">لا توجد ثغرات تطابق البحث</div>';
    document.getElementById('load-more').style.display = 'none';
    return;
  }

  list.innerHTML = shown.map((c, idx) => {
    const sev = getSeverity(c.score);
    const isLong = c.desc.length > 240;
    return `<div class="cve-card">
      <div class="cve-header">
        <div style="display:flex;align-items:center;gap:10px">
          <span class="cve-id">${c.id}</span>
          <span class="cve-date">${formatDate(c.published)}</span>
        </div>
        <div class="cve-meta">
          <span class="severity-badge ${sev.cls}">${sev.label}</span>
          <span class="cvss-score">${c.score.toFixed(1)}</span>
        </div>
      </div>
      <div class="cve-desc">${isLong ? c.desc.slice(0, 240) + '...' : c.desc}</div>
      ${c.products.length ? `<div class="cve-products">${c.products.map(p => `<span class="product-tag">${p}</span>`).join('')}</div>` : ''}
      ${isLong ? `<button class="read-more-btn" onclick="openCveModal(${idx})">اقرأ المزيد ←</button>` : ''}
    </div>`;
  }).join('');

  // Store currently shown CVEs for modal access
  window._shownCVEs = shown;

  document.getElementById('load-more').style.display = filtered.length > displayCount ? 'block' : 'none';
}

function loadMore() {
  displayCount += 20;
  renderList();
}

// CVE Modal
function openCveModal(idx) {
  const c = window._shownCVEs[idx];
  if (!c) return;
  const sev = getSeverity(c.score);
  document.getElementById('modal-id').textContent = c.id;
  document.getElementById('modal-sev').textContent = sev.label;
  document.getElementById('modal-sev').className = 'severity-badge ' + sev.cls;
  document.getElementById('modal-score').textContent = c.score.toFixed(1);
  document.getElementById('modal-date').textContent = formatDate(c.published);
  document.getElementById('modal-desc').textContent = c.desc;
  const wrap = document.getElementById('modal-products-wrap');
  if (c.products.length) {
    wrap.style.display = 'block';
    document.getElementById('modal-products').innerHTML = c.products.map(p => `<span class="product-tag">${p}</span>`).join('');
  } else {
    wrap.style.display = 'none';
  }
  document.getElementById('modal-nvd-link').href = `https://nvd.nist.gov/vuln/detail/${c.id}`;
  document.getElementById('cve-modal').classList.add('open');
}

function closeCveModal(e) {
  if (e && e.target !== document.getElementById('cve-modal')) return;
  document.getElementById('cve-modal').classList.remove('open');
}

// Close on ESC
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('cve-modal').classList.remove('open');
});

loadCVEs();
</script>
</body>
