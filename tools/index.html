<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>الأدوات | Maqbali</title>
  <meta name="description" content="أدوات موقع محمد المقبالي. اختر الأداة التي تريد استخدامها، وابدأ مع صانع فيديوهات التلاوة.">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#f5f0e8">
  <link rel="icon" href="/images/favicon.png" type="image/png">
  <link rel="canonical" href="https://www.maqbali.com/tools/">
  <script src="/core/v1/core.js"></script>
  <link rel="stylesheet" href="/core/v1/core.css">
  <style>
/* Maqbali Tools: styles are scoped to this page, not Maqbali Core. */
.site-main--tools {
  width: 100%;
  max-width: 1030px;
  padding-block: clamp(32px, 6vw, 64px) 64px;
  min-width: 0;
}
.maq-tools { width: 100%; min-width: 0; }
.maq-tools__intro { text-align: center; margin: 0 auto 44px; }
.maq-tools__eyebrow {
  display: block; color: var(--site-gold); letter-spacing: 2px;
  font: 600 11px/1.8 Arial, sans-serif; margin-bottom: 13px;
}
.maq-tools__intro h1 {
  font-size: clamp(26px, 4vw, 37px);
  font-weight: 700; line-height: 1.6; margin: 0 0 6px;
}
.maq-tools__intro p {
  color: var(--site-muted); font-size: 13px;
  line-height: 2; margin: 0 auto; max-width: 560px;
}
.maq-tools__heading {
  display: flex; align-items: center; gap: 10px;
  margin: 0 0 15px; color: var(--site-gold);
}
.maq-tools__heading h2 { font-size: 15px; font-weight: 700; margin: 0; }
.maq-tools__count {
  display: inline-grid; place-items: center; min-width: 24px; height: 24px;
  padding-inline: 7px; font: 600 11px/1 Arial, sans-serif;
  border-radius: 99px; border: 1px solid var(--site-border);
  color: var(--site-muted);
}
.maq-tools__grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
  gap: 15px;
}
.maq-tools__card {
  display: flex; flex-direction: column; gap: 15px;
  padding: 23px; border-radius: 17px;
  border: 1px solid var(--site-border);
  background: var(--site-panel);
  min-width: 0;
  transition: border-color .2s ease, box-shadow .2s ease;
}
.maq-tools__card:hover {
  border-color: var(--site-gold);
  box-shadow: 0 8px 28px rgba(150,120,40,.09);
}
.maq-tools__card-top {
  display: flex; align-items: center; gap: 13px;
  padding-bottom: 16px; border-bottom: 1px solid var(--site-border);
}
.maq-tools__icon {
  display: grid; place-items: center;
  width: 48px; height: 48px;
  min-width: 48px; max-width: 48px;
  min-height: 48px; max-height: 48px;
  flex: 0 0 48px; overflow: hidden;
  border-radius: 12px;
  color: var(--site-gold);
  background: var(--site-gold-muted);
}
/* Explicit SVG dimensions + wrapper constraints avoid giant icons if CSS changes elsewhere. */
.maq-tools__icon svg, .maq-tools__action svg {
  display: block; flex: none; overflow: hidden;
}
.maq-tools__icon svg { width: 24px; height: 24px; max-width: 24px; max-height: 24px; }
.maq-tools__card-label { flex: 1; min-width: 0; }
.maq-tools__card-label h3 {
  font-size: 15px; font-weight: 700; line-height: 1.8; margin: 0;
}
.maq-tools__category { margin: 2px 0 0; color: var(--site-muted); font-size: 11px; }
.maq-tools__availability {
  flex: none; border: 1px solid var(--site-border);
  border-radius: 50px; padding: 4px 11px;
  color: var(--site-gold); background: var(--site-gold-muted);
  font-size: 10px; white-space: nowrap;
}
.maq-tools__description {
  margin: 0; color: var(--site-muted); font-size: 12px;
  line-height: 2; flex: 1;
}
.maq-tools__action {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; min-height: 45px; width: 100%;
  padding: 9px 16px; border-radius: 10px;
  background: var(--site-gold); color: var(--site-bg) !important;
  text-decoration: none; font-size: 12px; font-weight: 700;
  transition: filter .2s ease, transform .2s ease;
}
.maq-tools__action:hover { filter: brightness(1.12); transform: translateY(-1px); }
.maq-tools__action svg { width: 16px; height: 16px; max-width: 16px; max-height: 16px; }
@media (max-width: 680px) {
  .site-main--tools { padding-block: 30px 48px; }
  .maq-tools__intro { margin-bottom: 34px; }
  .maq-tools__card { padding: 17px; }
  .maq-tools__card-top { gap: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  .maq-tools__card, .maq-tools__action { transition: none; }
}
</style>
</head>
<body class="site-page site-page--tools">
<header class="site-topbar" role="banner">
  <div class="site-topbar__inner">
    <a class="site-brand" href="/" aria-label="العودة إلى الصفحة الرئيسية">
      <img class="site-brand__logo" src="/images/logo_2.png" width="64" height="64" alt="شعار محمد المقبالي" decoding="async">
      <span class="site-brand__text"><b>محمد المقبالي</b><small lang="en" dir="ltr">MOHAMMED AL-MAQBALI</small></span>
    </a>
    <nav class="site-actions" aria-label="خيارات الموقع">
      <a class="site-icon-button site-sitemap-button" href="/sitemap.html" aria-label="خريطة الموقع" title="خريطة الموقع" data-tooltip="خريطة الموقع">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="m3 6 6-2 6 2 6-2v14l-6 2-6-2-6 2V6Zm6-2v14m6-12v14" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </a>
      <button class="site-icon-button site-theme-button" id="themeToggle" type="button" aria-label="تغيير المظهر" aria-pressed="false" title="تغيير المظهر">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </nav>
  </div>
</header>
<main id="main-content" class="site-main site-main--tools">
  <div class="maq-tools">
    <div class="maq-tools__intro">
      <span class="maq-tools__eyebrow" lang="en" dir="ltr">MAQBALI.COM</span>
      <h1>أدوات الموقع</h1>
      <p>أدوات الموقع في مكان واحد. اختر الأداة التي تريد استخدامها.</p>
    </div>

    <section aria-labelledby="maq-tools-available">
      <div class="maq-tools__heading">
        <h2 id="maq-tools-available">الأدوات المتاحة</h2>
        <span class="maq-tools__count" aria-label="أداة واحدة">1</span>
      </div>
      <div class="maq-tools__grid">
        <article class="maq-tools__card" aria-labelledby="maq-quran-title">
          <div class="maq-tools__card-top">
            <span class="maq-tools__icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" focusable="false">
                <path d="M12 5c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-3-1-6-1-9 1Zm0 0v15M6 8h3M6 11h3M15 8h3M15 11h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <div class="maq-tools__card-label">
              <h3 id="maq-quran-title">صانع فيديوهات التلاوة</h3>
              <p class="maq-tools__category">إنشاء المحتوى</p>
            </div>
            <span class="maq-tools__availability">متاحة</span>
          </div>
          <p class="maq-tools__description">إنشاء فيديو تلاوة باختيار الآيات والقارئ والخلفية، مع المعاينة وتنزيل الفيديو.</p>
          <a class="maq-tools__action" href="/tools/quran/" aria-label="فتح صانع فيديوهات التلاوة">
            فتح الأداة
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M19 12H5m7-7-7 7 7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
        </article>
      </div>
    </section>
  </div>
</main>
<footer class="site-footer" role="contentinfo">
  <span class="site-footer__credit">صمم <span class="site-footer__heart" aria-hidden="true">♥</span> <a href="https://www.maqbali.com/" lang="en" dir="ltr">Maqbali</a></span>
</footer>
</body>
</html>
