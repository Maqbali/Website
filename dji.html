<link rel="stylesheet" href="/core/v1/core.css">
<style>
.site-legacy *, .site-legacy *::before, .site-legacy *::after { margin: 0; padding: 0; box-sizing: border-box; }
.site-legacy {
      min-height: 100vh; background: #f5f0e8;
      font-family: "Cairo", sans-serif;
      display: flex; flex-direction: column; align-items: center; padding-bottom: 4rem;
    }
.site-legacy::before {
      content: ""; position: fixed; inset: 0;
      background: radial-gradient(ellipse at 20% 20%, rgba(200,169,110,.07) 0%, transparent 50%),
                  radial-gradient(ellipse at 80% 80%, rgba(200,169,110,.04) 0%, transparent 45%);
      pointer-events: none;
    }
.site-legacy .nav {
      width: 100%; padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(245,240,232,0.92); backdrop-filter: blur(12px);
      border-bottom: 0.5px solid rgba(200,169,110,0.2);
      position: sticky; top: 0; z-index: 100;
    }
.site-legacy .nav-inner { width: 100%; max-width: 900px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
.site-legacy .nav-title { font-size: 15px; font-weight: 700; color: #2a1f0a; }
.site-legacy .nav-logo { font-size: 13px; font-weight: 700; color: #c8a96e; letter-spacing: 2px; text-decoration: none; }
.site-legacy .container { width: 100%; max-width: 900px; padding: 24px 16px; }
.site-legacy .info-banner {
      background: rgba(200,169,110,0.08);
      border: 0.5px solid rgba(200,169,110,0.25);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 1.5rem;
      display: flex; align-items: flex-start; gap: 12px;
      animation: fadeUp 0.5s ease both;
    }
.site-legacy .info-icon {
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(200,169,110,0.15); color: #c8a96e;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
.site-legacy .info-icon svg { width: 16px; height: 16px; }
.site-legacy .info-text { flex: 1; }
.site-legacy .info-title { font-size: 12px; font-weight: 700; color: #2a1f0a; margin-bottom: 2px; }
.site-legacy .info-desc { font-size: 11px; color: #888; line-height: 1.6; }
@keyframes fadeUp { from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)} }
.site-legacy .section-title { font-size: 12px; color: #c8a96e; font-weight: 700; letter-spacing: 1.5px; margin: 0 0 0.8rem 4px; }
.site-legacy .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.site-legacy .device-card {
      background: #fff; border: 0.5px solid rgba(200,169,110,0.2);
      border-radius: 16px; padding: 18px;
      box-shadow: 0 4px 20px rgba(200,169,110,0.06);
      transition: all 0.2s;
      animation: fadeUp 0.5s ease both;
      position: relative;
    }
.site-legacy .device-card:hover { border-color: rgba(200,169,110,0.4); }
.site-legacy .device-header {
      display: flex; align-items: center; gap: 12px;
      padding-bottom: 14px; margin-bottom: 14px;
      border-bottom: 0.5px solid rgba(200,169,110,0.12);
    }
.site-legacy .device-icon {
      width: 48px; height: 48px; border-radius: 12px;
      background: rgba(200,169,110,0.12);
      color: #c8a96e;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
.site-legacy .device-icon svg { width: 26px; height: 26px; }
.site-legacy .device-title { flex: 1; }
.site-legacy .device-name { font-size: 15px; font-weight: 700; color: #2a1f0a; }
.site-legacy .device-category { font-size: 10px; color: #999; letter-spacing: 0.5px; margin-top: 2px; }
.site-legacy .badge {
      font-size: 9px; font-weight: 700; padding: 3px 9px;
      border-radius: 20px; letter-spacing: 0.5px;
    }
.site-legacy .badge.update { background: rgba(76,175,80,0.12); color: #4caf50; border: 0.5px solid rgba(76,175,80,0.3); }
.site-legacy .badge.latest { background: rgba(200,169,110,0.12); color: #c8a96e; border: 0.5px solid rgba(200,169,110,0.3); }
.site-legacy .firmware-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0;
      border-bottom: 0.5px solid rgba(200,169,110,0.08);
    }
.site-legacy .firmware-row:last-of-type { border-bottom: none; }
.site-legacy .fw-info { display: flex; align-items: center; gap: 8px; }
.site-legacy .fw-status {
      width: 18px; height: 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; flex-shrink: 0;
    }
.site-legacy .fw-status.current { background: rgba(76,175,80,0.15); color: #4caf50; }
.site-legacy .fw-status.old { background: rgba(150,150,150,0.15); color: #aaa; }
.site-legacy .fw-version { font-size: 12px; font-weight: 600; color: #2a1f0a; direction: ltr; }
.site-legacy .fw-version.old { color: #999; }
.site-legacy .fw-date { font-size: 10px; color: #aaa; direction: ltr; }
.site-legacy .label-row {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 10px; color: #999; letter-spacing: 0.5px;
      padding: 4px 0; margin-bottom: 4px;
    }
.site-legacy .install-info {
      margin-top: 14px; padding: 10px 12px;
      background: rgba(200,169,110,0.05);
      border: 0.5px dashed rgba(200,169,110,0.3);
      border-radius: 10px;
      font-size: 11px; color: #888;
      display: flex; align-items: flex-start; gap: 8px;
    }
.site-legacy .install-info svg { width: 14px; height: 14px; color: #c8a96e; flex-shrink: 0; margin-top: 1px; }
.site-legacy .download-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 12px; padding: 10px 16px;
      background: #c8a96e; color: #fff;
      border: none; border-radius: 10px;
      font-family: "Cairo", sans-serif; font-size: 12px; font-weight: 700;
      text-decoration: none; cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
.site-legacy .download-btn:hover { background: #a88a4e; }
.site-legacy .download-btn svg { width: 14px; height: 14px; }
.site-legacy .changelog-toggle {
      margin-top: 10px; padding: 6px 0;
      background: transparent; border: none;
      font-family: "Cairo", sans-serif; font-size: 11px; font-weight: 600;
      color: #c8a96e; cursor: pointer;
      display: flex; align-items: center; gap: 4px;
      transition: opacity 0.2s;
    }
.site-legacy .changelog-toggle:hover { opacity: 0.7; }
.site-legacy .changelog-toggle svg { width: 12px; height: 12px; transition: transform 0.2s; }
.site-legacy .changelog-toggle.open svg { transform: rotate(180deg); }
.site-legacy .changelog {
      display: none; margin-top: 8px; padding: 10px 12px;
      background: #faf7f2; border-radius: 8px;
      font-size: 11px; color: #666; line-height: 1.7;
    }
.site-legacy .changelog.open { display: block; animation: fadeUp 0.3s ease; }
.site-legacy .changelog ul { margin: 6px 0 0 0; padding-right: 18px; }
.site-legacy .changelog li { margin-bottom: 4px; }
.site-legacy .footer {
      margin-top: 2rem; text-align: center; font-size: 11px; color: #bbb;
    }
.site-legacy .footer a { color: #c8a96e; text-decoration: none; font-weight: 600; }
@media  (max-width: 500px) {.site-legacy .grid { grid-template-columns: 1fr; }}

/* Page-only colour bridge: the shared Core remains independent. */
.site-legacy {
 --bg:var(--site-bg);--bg-grad:var(--site-bg);--card:var(--site-panel);--card2:var(--site-gold-muted);
 --surface:var(--site-panel);--surface-2:var(--site-gold-muted);
 --text:var(--site-text);--text2:var(--site-text);--muted:var(--site-muted);--gold:var(--site-gold);
 --gold-dark:var(--site-gold);--brand:var(--site-gold);--line:var(--site-border);--border:var(--site-border);
 --border2:var(--site-border);--panel:var(--site-panel);--gold-muted:var(--site-gold-muted);
 --shadow:0 4px 20px rgba(0,0,0,.05);
 width:100%;min-width:0;min-height:0!important;padding:0!important;margin:0!important;
 background:transparent!important;color:var(--site-text)!important;
 font-family:'Cairo',Tahoma,Arial,sans-serif!important;
 display:block!important;
}
.site-legacy::before{display:none!important}
.site-main--legacy{max-width:1060px;padding-block:26px 48px;min-width:0;flex:1 0 auto}
.site-legacy img{max-width:100%}
.site-legacy button,.site-legacy input,.site-legacy textarea,.site-legacy select{font-family:inherit}
.site-legacy .page,.site-legacy .container,.site-legacy .wrap{max-width:100%;}
.site-legacy a{color:inherit;text-decoration:none}
.site-legacy a:focus-visible,.site-legacy button:focus-visible{outline:2px solid var(--site-gold);outline-offset:3px}
.site-legacy .footer,.site-legacy > footer{display:none}
.site-legacy input,.site-legacy textarea,.site-legacy select{max-width:100%}
.site-legacy .site-page-intro{display:none}
@media(max-width:580px){.site-main--legacy{padding-block:18px 36px}}


/* Colour refinements on legacy component surfaces */
.site-legacy .card,.site-legacy .price-card,.site-legacy .oil-card,.site-legacy .stat-card,
.site-legacy .device-card,.site-legacy .form-card,.site-legacy .info-card,.site-legacy .cve-card,
.site-legacy .details-card,.site-legacy .ip-card,.site-legacy .summary-card,.site-legacy .modal-box,
.site-legacy .filter-bar,.site-legacy .date-bar,.site-legacy .tool-card,
.site-legacy .gauge,.site-legacy .stats .stat,.site-legacy .chart-wrap,
.site-legacy .log-item,.site-legacy .map-card {background:var(--site-panel);border-color:var(--site-border);color:var(--site-text)}
.site-legacy .card-head,.site-legacy .info-banner{color:var(--site-text)}
.site-legacy .device-name,.site-legacy .info-title,.site-legacy .hero h1,.site-legacy .success h3 {color:var(--site-text)}
.site-legacy .device-category,.site-legacy .info-desc,.site-legacy .hero p,.site-legacy .success p,.site-legacy .form-group label,.site-legacy .info-item-text p {color:var(--site-muted)}
.site-legacy .changelog {background:var(--site-gold-muted);color:var(--site-text)}
.site-legacy .info-icon,.site-legacy .device-icon,.site-legacy .success-icon {background:var(--site-gold-muted)}
.site-legacy .form-group input,.site-legacy .form-group select,.site-legacy .form-group textarea,
.site-legacy .search-input,.site-legacy textarea {background:var(--site-panel);border-color:var(--site-border);color:var(--site-text)}
.site-legacy .form-title,.site-legacy .info-title,.site-legacy .section-title,.site-legacy .device-icon {color:var(--site-gold)}
.site-legacy .download-btn,.site-legacy .submit-btn,.site-legacy .btn-primary{background:var(--site-gold);color:var(--site-bg)}
.site-legacy .legacy-note {margin:25px 0 0;padding:13px 10px;text-align:center;color:var(--site-muted);font-size:12px;border-top:1px solid var(--site-border)}

</style>
</head>
<body class="site-page site-page--dji">
<header class="site-topbar" role="banner">
  <div class="site-topbar__inner">
    <a class="site-brand" href="/" aria-label="العودة إلى الصفحة الرئيسية">
      <img class="site-brand__logo" src="/images/logo_2.png" width="64" height="64" alt="شعار محمد المقبالي" decoding="async">
      <span class="site-brand__text"><b>محمد المقبالي</b><small lang="en" dir="ltr">MOHAMMED AL-MAQBALI</small></span>
    </a>
    <nav class="site-actions" aria-label="خيارات الموقع">
      <a class="site-icon-button site-sitemap-button" href="/sitemap.html" aria-label="خريطة الموقع" title="خريطة الموقع" data-tooltip="خريطة الموقع">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="m3 6 6-2 6 2 6-2v14l-6 2-6-2-6 2V6Zm6-2v14m6-12v14" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </a>
      <button class="site-icon-button site-theme-button" id="themeToggle" type="button" aria-label="تغيير المظهر" aria-pressed="false" title="تغيير المظهر">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </nav>
  </div>
</header>

<main id="main-content" class="site-main site-main--legacy">
<div class="site-legacy legacy--dji">


<div class="container">
<!-- INFO BANNER -->
<div class="info-banner">
<div class="info-icon">
<svg fill="none" viewbox="0 0 24 24"><path d="M12 16v-4M12 8h.01M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z" stroke="currentColor" stroke-linecap="round" stroke-width="1.8"></path></svg>
</div>
<div class="info-text">
<div class="info-title">صفحة متابعة فقط</div>
<div class="info-desc">هذه الصفحة لمتابعة آخر التحديثات. التحديث الفعلي يتم عبر <strong style="color:#c8a96e">DJI Fly</strong> أو <strong style="color:#c8a96e">DJI Assistant 2</strong> الرسمي لتفادي أي مشاكل.</div>
</div>
</div>
<div class="section-title">◆ الأجهزة المتابعة</div>
<div class="grid" id="device-grid"></div>

</div>


</div>
</main>
<footer class="site-footer" role="contentinfo">
  <span class="site-footer__credit">صمم <span class="site-footer__heart" aria-hidden="true">♥</span> <a href="https://www.maqbali.com/" lang="en" dir="ltr">Maqbali</a></span>
</footer>

<script>
const DEVICES = [
  {
    name: 'DJI Mini 5 Pro',
    category: 'Drone · Sub-250g',
    icon: 'drone',
    firmware: [
      {
        version: 'v01.00.0100',
        date: '2025-09-25',
        current: true,
        notes: [
          'الإصدار الأولي من المصنع',
          'دعم استشعار العوائق ثلاثي الأبعاد',
          'كاميرا 1-inch CMOS مع مدى ديناميكي 14 stop',
          'وقت طيران حتى 36 دقيقة'
        ]
      }
    ],
    downloadUrl: 'https://www.dji.com/mini-5-pro/downloads'
  }
];

function renderDevices() {
  const grid = document.getElementById('device-grid');
  grid.innerHTML = DEVICES.map((d, i) => {
    const latest = d.firmware[0];
    const hasUpdate = d.firmware.some(f => f.current);
    return `
      <div class="device-card" style="animation-delay:${i * 0.08}s">
        <div class="device-header">
          <div class="device-icon">
            <svg fill="none" viewBox="0 0 24 24">
              <path d="M2 7h4M18 7h4M2 17h4M18 17h4M7 2v4M7 18v4M17 2v4M17 18v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="7" y="7" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="12" cy="12" r="2" fill="currentColor"/>
            </svg>
          </div>
          <div class="device-title">
            <div class="device-name">${d.name}</div>
            <div class="device-category">${d.category}</div>
          </div>
          <span class="badge latest">آخر إصدار</span>
        </div>

        <div class="label-row">
          <span>الإصدار</span>
          <span>التاريخ</span>
        </div>

        ${d.firmware.map(f => `
          <div class="firmware-row">
            <div class="fw-info">
              <span class="fw-status ${f.current ? 'current' : 'old'}">${f.current ? '✓' : '·'}</span>
              <span class="fw-version ${f.current ? '' : 'old'}">${f.version}</span>
            </div>
            <span class="fw-date">${f.date}</span>
          </div>
        `).join('')}

        ${latest.notes && latest.notes.length ? `
          <button class="changelog-toggle" onclick="toggleChangelog(${i})" id="ct-${i}">
            <span>تفاصيل التحديث</span>
            <svg fill="none" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="changelog" id="cl-${i}">
            <ul>
              ${latest.notes.map(n => `<li>${n}</li>`).join('')}
            </ul>
          </div>
        ` : ''}

        <a href="${d.downloadUrl}" target="_blank" class="download-btn">
          <svg fill="none" viewBox="0 0 24 24"><path d="M14 3v4a1 1 0 001 1h4M17 21H7a2 2 0 01-2-2V5a2 2 0 012-2h7l5 5v11a2 2 0 01-2 2zM12 11v6M9 14l3 3 3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          عرض في الموقع الرسمي
        </a>
      </div>
    `;
  }).join('');
}

function toggleChangelog(i) {
  const cl = document.getElementById('cl-' + i);
  const ct = document.getElementById('ct-' + i);
  cl.classList.toggle('open');
  ct.classList.toggle('open');
}

renderDevices();
</script>
</body>
</html>
