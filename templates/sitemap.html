<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>{{PAGE_TITLE}}</title>
  <meta name="description" content="{{PAGE_DESCRIPTION}}">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#f5f0e8">
  <link rel="icon" href="/images/favicon.png" type="image/png">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <script src="/core/v1/core.js"></script>
  <link rel="stylesheet" href="/core/v1/core.css">
<style>
/* Styling belongs to this page, not Maqbali Core */
/* Sitemap: classification by migration status, not part of the Core data model. */
.site-main--sitemap { flex: 1 0 auto; max-width: 980px; padding-block: 36px 55px; }
.site-map-intro { text-align: center; margin-bottom: 36px; }
.site-map-intro__eyebrow { display: inline-block; color: var(--site-gold); font: 600 10px/1.5 Arial, sans-serif; letter-spacing: 1.8px; margin-bottom: 12px; }
.site-map-intro h1 { margin: 0 0 6px; font-size: clamp(24px,3vw,34px); line-height: 1.6; font-weight: 700; }
.site-map-intro p { color: var(--site-muted); font-size: 12px; margin: 0; }
.site-map-section { margin-top: 27px; }
.site-map-section__title { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; color: var(--site-gold); font-size: 15px; font-weight: 600; }
.site-map-section__count { display: inline-flex; min-width: 24px; justify-content: center; padding: 0 7px; color: var(--site-muted); border: 1px solid var(--site-border); border-radius: 50px; font: 600 11px/20px Arial; }
.site-map-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 295px), 1fr)); gap: 12px; }
.site-map-card { min-width: 0; border: 1px solid var(--site-border); background: var(--site-panel); border-radius: 14px; padding: 18px; transition: border-color .2s, transform .2s; }
.site-map-card:hover { border-color: var(--site-gold); transform: translateY(-1px); }
.site-map-card__top { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.site-map-card h3 { margin: 0; font-size: 14px; font-weight: 600; }
.site-map-card__path { margin: 4px 0 14px; font: 11px/1.6 ui-monospace, Consolas, monospace; color: var(--site-muted); overflow-wrap: anywhere; direction: ltr; text-align: right; }
.site-map-card__actions { display: flex; flex-wrap: wrap; gap: 8px; }
.site-map-card__link { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-height: 38px; flex: 1; border: 1px solid var(--site-border); border-radius: 8px; padding: 7px 12px; font-size: 11px; font-weight: 600; text-align: center; }
.site-map-card__link:hover { border-color: var(--site-gold); background: var(--site-gold-muted); }
.site-map-card__link--preview { background: var(--site-gold-muted); color: var(--site-gold) !important; }
.site-map-card__status { color: var(--site-muted); font-size: 10px; white-space: nowrap; }
.site-map-card__status--preview { color: var(--site-gold); }
@media(max-width:680px){.site-main--sitemap{padding-block:24px 42px}}
</style>
</head>
<body class="site-page site-page--sitemap">
{{HEADER}}
<main id="main-content" class="site-main site-main--sitemap">
  <div class="site-map-intro">
    <span class="site-map-intro__eyebrow">MAQBALI.COM</span>
    <h1>خريطة الموقع</h1>
    <p>استعرض صفحات الموقع وقارن بين النسخة الحالية والتجريبية عند توفرها.</p>
  </div>
{{SITE_MAP_CONTENT}}
</main>
{{FOOTER}}
</body>
</html>
