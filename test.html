<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3Beer Art</title>
  <meta name="description" content="3Beer Art">

  <link rel="icon" href="#" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --blue-deep:   #0d2236;
      --blue-dark:   #1a3d5c;
      --blue-main:   #255a85;
      --blue-bright: #3674a3;
      --blue-pale:   #a8c5dc;
      --white:       #ffffff;
      --sketch-bg:   #f5e9e3;
      --sketch-ink:  #2d4763;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    html, body {
      width: 100%;
      min-height: 100%;
      max-width: 100vw;
      overflow-x: hidden;
    }
    body {
      background: var(--blue-deep);
      font-family: 'Cairo', sans-serif;
    }

    /* ╔═══════════════════════════════╗
       ║  WELCOME OVERLAY              ║
       ╚═══════════════════════════════╝ */
    #welcome {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      cursor: grab;
      background: var(--sketch-bg);
      overflow: hidden;
      transition: opacity 0.8s ease;
    }
    #welcome:active { cursor: grabbing; }
    #welcome.dismissed { opacity: 0; pointer-events: none; }

    /* الدائرة الكحلية في المنتصف */
    .circle-bg {
      position: absolute;
      top: 50%; left: 50%;
      width: 440px; height: 440px;
      transform: translate(-50%, -50%) scale(1);
      background:
        radial-gradient(circle at center, #1e4266 0%, #0d2236 75%, #081726 100%);
      border-radius: 50%;
      z-index: 2;
      transition: transform 1.2s cubic-bezier(.7, 0, .3, 1);
      box-shadow:
        inset 0 0 100px rgba(255, 255, 255, 0.05),
        0 10px 60px rgba(13, 34, 54, 0.3);
    }

    /* خطوط دائرية متمركزة داخل الدائرة (إحساس الرسم) */
    .circle-bg::before {
      content: '';
      position: absolute;
      inset: 8%;
      border-radius: 50%;
      background:
        repeating-radial-gradient(circle at center,
          transparent 0, transparent 3px,
          rgba(255, 255, 255, 0.035) 3px, rgba(255, 255, 255, 0.035) 4px);
    }

    /* الشخصية المرسومة في منتصف الدائرة */
    .character {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -35%);
      z-index: 3;
      width: 200px;
      height: auto;
      transition: opacity 0.6s ease;
    }
    .character svg {
      width: 100%;
      height: auto;
      stroke: var(--sketch-bg);
      fill: none;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* الأيقونات الزخرفية حول الدائرة */
    .icons-layer {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 1000px;
      height: 600px;
      z-index: 1;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    .deco-icon {
      position: absolute;
      width: 65px; height: 65px;
    }
    .deco-icon svg {
      width: 100%; height: 100%;
      stroke: var(--sketch-ink);
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* مواقع الأيقونات على شكل سكتش */
    .ic-book1    { top: 4%;  left: 10%; }
    .ic-melon1   { top: 6%;  left: 22%; }
    .ic-dollar1  { top: 2%;  left: 36%; transform: rotate(-5deg); }
    .ic-head1    { top: 4%;  right: 16%; transform: rotate(3deg); }
    .ic-melon2   { top: 6%;  right: 28%; }
    .ic-book2    { top: 3%;  right: 5%; transform: rotate(5deg); }
    .ic-plant    { top: 30%; left: 4%; }
    .ic-hands1   { top: 32%; left: 18%; }
    .ic-face1    { top: 52%; left: 22%; }
    .ic-chat1    { top: 55%; left: 9%; }
    .ic-check    { top: 48%; left: 1%; }
    .ic-target   { bottom: 18%; left: 4%; }
    .ic-calendar { bottom: 6%;  left: 15%; }
    .ic-bulb1    { bottom: 14%; left: 30%; }
    .ic-heart    { top: 30%; right: 18%; }
    .ic-hands2   { top: 34%; right: 5%; }
    .ic-palette  { top: 44%; right: 1%; }
    .ic-chat2    { top: 52%; right: 20%; }
    .ic-dollar2  { top: 58%; right: 5%; transform: rotate(3deg); }
    .ic-bulb2    { bottom: 16%; right: 20%; }
    .ic-globe    { bottom: 6%;  right: 8%; }

    /* شعار يظهر بعد توسّع الدائرة */
    .welcome-final {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      text-align: center;
      opacity: 0;
      transition: opacity 0.8s ease 0.5s;
      pointer-events: none;
    }
    .welcome-final.show { opacity: 1; }
    .welcome-logo {
      width: 220px;
      height: 220px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }
    .welcome-logo-placeholder {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.03);
      position: relative;
    }
    .welcome-logo-placeholder::before {
      content: '';
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    @media (max-width: 700px) {
      .welcome-logo, .welcome-logo-placeholder { width: 160px; height: 160px; }
    }

    /* HINT */
    #hint {
      position: absolute; bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      transition: opacity 0.5s ease;
    }
    #hint p {
      color: var(--sketch-ink);
      font-family: 'Cairo', sans-serif;
      font-size: 11px; letter-spacing: .3em;
      font-weight: 500;
    }
    .mouse {
      width: 24px; height: 38px;
      border: 1.5px solid var(--sketch-ink);
      border-radius: 12px;
      position: relative; display: flex; justify-content: center;
    }
    .mdot {
      width: 3px; height: 3px; border-radius: 50%;
      background: var(--sketch-ink); position: absolute; top: 6px;
      animation: mdot 1.8s ease-in-out infinite;
    }
    @keyframes mdot {
      0%   { transform: translateY(0); opacity: 1; }
      80%  { transform: translateY(18px); opacity: 0; }
      100% { transform: translateY(0); opacity: 0; }
    }

    /* استجابة الجوال */
    @media (max-width: 700px) {
      .circle-bg { width: 280px; height: 280px; }
      .character { width: 130px; }
      .icons-layer { width: 100%; height: 500px; }
      .deco-icon { width: 44px; height: 44px; }
    }

    /* ╔═══════════════════════════════╗
       ║  MAIN SITE (بسيط وأنيق)       ║
       ╚═══════════════════════════════╝ */
    #site {
      min-height: 100vh;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background: var(--blue-deep);
      opacity: 0;
      transition: opacity .7s ease .3s;
      position: relative;
      color: var(--white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    #site.on { opacity: 1; }

    /* خلفية زخرفية */
    .site-bg {
      position: absolute; inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(54, 116, 163, 0.2) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 70%, rgba(54, 116, 163, 0.15) 0%, transparent 55%);
    }
    .site-stars {
      position: absolute; inset: 0;
      z-index: 0; pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 25% 15%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 70% 40%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1.5px 1.5px at 15% 70%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 85% 85%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 40% 95%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 60% 20%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1px 1px at 90% 50%, rgba(255,255,255,0.5), transparent);
      opacity: 0.5;
      animation: starTwinkle 8s ease-in-out infinite alternate;
    }
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.3; }
      50%      { opacity: 0.7; }
    }

    .site-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      max-width: 700px;
      padding: 3rem 1rem;
    }

    /* مكان الشعار - دائرة فاضية جاهزة */
    .logo-placeholder {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      backdrop-filter: blur(10px);
    }
    .logo-placeholder::before {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .logo-placeholder::after {
      content: '';
      position: absolute;
      inset: -22px;
      border-radius: 50%;
      border: 0.5px solid rgba(255, 255, 255, 0.05);
    }
    /* لصورة الشعار لما تضاف */
    .logo-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .connect-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.95rem;
      font-style: italic;
      color: rgba(255, 255, 255, 0.75);
      letter-spacing: 4px;
      direction: ltr;
      margin-top: 1rem;
    }

    /* النص التعريفي بين الشعار والتواصل */
    .intro-text {
      max-width: 560px;
      margin: 1.5rem auto 0.5rem;
      padding: 0 1rem;
    }
    .intro-text p {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1rem, 1.5vw, 1.2rem);
      line-height: 2;
      color: rgba(255, 255, 255, 0.72);
      text-align: center;
      font-style: italic;
      letter-spacing: 0.5px;
      font-weight: 300;
    }
    /* للنصوص العربية خلي الخط كايرو بس */
    .intro-text p:lang(ar),
    [lang="ar"] .intro-text p {
      font-family: 'Cairo', sans-serif;
      font-style: normal;
      line-height: 2.1;
    }

    .icons {
      display: flex;
      gap: 1.5rem;
      direction: ltr;
      margin-top: 0.8rem;
    }

    .icon-link {
      width: 58px; height: 58px; border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.04);
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; cursor: pointer;
      transition: transform .4s cubic-bezier(.34,1.56,.64,1),
                  border-color .3s, background .3s, box-shadow .3s;
      position: relative;
      backdrop-filter: blur(10px);
    }
    .icon-link:hover {
      transform: translateY(-6px) scale(1.08);
      border-color: rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
    }
    .icon-link svg {
      width: 22px; height: 22px;
      fill: rgba(255, 255, 255, 0.8);
      transition: fill .3s;
    }
    .icon-link:hover svg { fill: var(--white); }
    .icon-link .tip {
      position: absolute; bottom: -24px;
      font-family: 'Cormorant Garamond', serif;
      font-size: .75rem; letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.85);
      white-space: nowrap; opacity: 0;
      transition: opacity .2s;
      pointer-events: none;
      font-style: italic;
    }
    .icon-link:hover .tip { opacity: 1; }

    .site-footer {
      position: absolute;
      bottom: 1.5rem;
      left: 0; right: 0;
      text-align: center;
      z-index: 2;
    }
    .site-footer-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.95rem;
      font-style: italic;
      color: var(--white);
      letter-spacing: 3px;
      opacity: 0.7;
    }
  </style>
</head>

    <svg viewBox="0 0 200 220">
      <!-- الحجاب/الرأس -->

  <!-- الشعار يظهر بعد توسّع الدائرة -->

    <!-- ضع صورة شعارك هنا. إذا ما عندك صورة، احذف السطر التالي وضع: <div class="welcome-logo-placeholder"></div> -->

  </div>

  <!-- اسحب للدخول -->
  <div id="hint">
    <p>اسحب للأعلى</p>
    <div class="mouse"><div class="mdot"></div></div>
  </div>
</div>

<script>
  const welcome      = document.getElementById('welcome');
  const circleBg     = document.getElementById('circleBg');
  const character    = document.getElementById('character');
  const iconsLayer   = document.getElementById('iconsLayer');
  const welcomeFinal = document.getElementById('welcomeFinal');
  const hint         = document.getElementById('hint');
  const site         = document.getElementById('site');

  let gone = false, startY = null, currentProgress = 0;

  // حساب أقصى حجم للدائرة حتى تبلع الشاشة
  function maxCircleScale() {
    const diagonal = Math.sqrt(window.innerWidth ** 2 + window.innerHeight ** 2);
    return (diagonal / 440) * 1.3;
  }

  function updateExpansion(progress) {
    currentProgress = progress;
    const scale = 1 + (maxCircleScale() - 1) * progress;
    circleBg.style.transition = 'none';
    circleBg.style.transform = `translate(-50%, -50%) scale(${scale})`;

    // الشخصية والأيقونات تتلاشى
    character.style.opacity = 1 - progress * 1.8;
    iconsLayer.style.opacity = 1 - progress * 1.8;
    hint.style.opacity = 1 - progress * 2;

    // نص الترحيب النهائي يظهر بعد تجاوز 0.6
    if (progress > 0.6) {
      welcomeFinal.classList.add('show');
    } else {
      welcomeFinal.classList.remove('show');
    }
  }

  function dismiss() {
    if (gone) return;
    gone = true;

    circleBg.style.transition = 'transform 1.2s cubic-bezier(.7, 0, .3, 1)';
    circleBg.style.transform = `translate(-50%, -50%) scale(${maxCircleScale()})`;
    character.style.opacity = 0;
    iconsLayer.style.opacity = 0;
    hint.style.opacity = 0;
    welcomeFinal.classList.add('show');

    // بعد 2 ثانية نخفي الترحيب كلياً ونظهر الموقع
    setTimeout(() => {
      welcome.classList.add('dismissed');
      site.classList.add('on');
      document.body.style.overflow = 'auto';
    }, 2000);
  }

  function drag(dy) {
    if (gone) return;
    const progress = Math.max(0, Math.min(1, -dy / 250));
    updateExpansion(progress);
    if (progress >= 0.95) dismiss();
  }

  function release() {
    if (gone) return;
    if (currentProgress > 0.4) {
      dismiss();
    } else {
      circleBg.style.transition = 'transform 0.6s cubic-bezier(.2, .8, .2, 1)';
      circleBg.style.transform = 'translate(-50%, -50%) scale(1)';
      character.style.transition = 'opacity 0.5s ease';
      iconsLayer.style.transition = 'opacity 0.5s ease';
      character.style.opacity = 1;
      iconsLayer.style.opacity = 1;
      hint.style.opacity = 1;
      welcomeFinal.classList.remove('show');
      currentProgress = 0;
      setTimeout(() => {
        character.style.transition = 'opacity 0.6s ease';
        iconsLayer.style.transition = 'opacity 0.6s ease';
      }, 600);
    }
  }

  welcome.addEventListener('mousedown', e => {
    if (!gone) startY = e.clientY;
  });
  window.addEventListener('mousemove', e => {
    if (startY != null && !gone) drag(e.clientY - startY);
  });
  window.addEventListener('mouseup', () => {
    if (startY != null) { release(); startY = null; }
  });

  welcome.addEventListener('touchstart', e => {
    if (!gone) startY = e.touches[0].clientY;
  }, {passive: true});
  window.addEventListener('touchmove', e => {
    if (startY != null && !gone) drag(e.touches[0].clientY - startY);
  }, {passive: true});
  window.addEventListener('touchend', () => {
    if (startY != null) { release(); startY = null; }
  });

  window.addEventListener('wheel', e => {
    if (!gone && e.deltaY > 20) dismiss();
  }, {passive: true});
  window.addEventListener('keydown', e => {
    if (!gone && ['ArrowDown', 'Space', 'Enter'].includes(e.code)) dismiss();
  });
</script>
